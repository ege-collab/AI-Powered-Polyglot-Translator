<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Polyglot AI - UI Prototipi</title><style>body{margin:0;font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;min-height:100vh}aside{width:220px;background:#1e293b;padding:20px;border-right:1px solid #334155}nav button{display:block;width:100%;background:none;border:none;color:#94a3b8;text-align:left;padding:12px;cursor:pointer;border-radius:8px;font-size:14px}nav button.active,nav button:hover{background:#2563eb;color:#fff}main{flex:1;padding:30px}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#1e293b;padding:20px;border-radius:12px;border:1px solid #334155}textarea,select{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:8px;padding:10px;margin-top:10px}textarea{height:160px}.btn{background:#3b82f6;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;margin-top:12px;font-weight:bold}</style></head><body><aside><h2 style="color:#3b82f6">Polyglot AI</h2><nav><button class="active" onclick="tab(0,this)">Metin Cevirisi</button><button onclick="tab(1,this)">Ses ve Belge</button><button onclick="tab(2,this)">Ceviri Gecmisi</button><button onclick="tab(3,this)">Ayarlar</button></nav></aside><main><div class="screen active"><h1>AI Ceviri Studyosu</h1><div class="grid"><div class="card"><select><option>Turkce</option><option>Ingilizce</option></select><textarea id="in">Merhaba, Sprint 2 arayuz tasarimlari hazir.</textarea><button class="btn" onclick="document.getElementById('out').value='Hello, Sprint 2 UI designs are ready.'">Cevir</button></div><div class="card"><select><option>Ingilizce</option><option>Turkce</option></select><textarea id="out" readonly>Hello, Sprint 2 UI designs are ready.</textarea><button class="btn" onclick="alert('Kopyalandi!')">Kopyala</button></div></div></div><div class="screen"><h1>Sesli Ceviri ve Belge Yukleme</h1><div class="card"><p>Mikrofon kaydi baslat veya PDF/DOCX dosyasi surukle.</p><button class="btn" onclick="alert('Kayit basladi')">Ses Kaydi Baslat</button></div></div><div class="screen"><h1>Ceviri Gecmisi</h1><div class="card"><p>TR -> EN: Sprint 2 teslim tarihi Sali 23:59.</p></div></div><div class="screen"><h1>Ayarlar</h1><div class="card"><p>Varsayilan Model: Polyglot-Pro AI</p><button class="btn" onclick="alert('Kaydedildi')">Kaydet</button></div></div></main><script>function tab(i,b){document.querySelectorAll(".screen").forEach((s,idx)=>s.classList.toggle("active",idx===i));document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}</script></body></html>
